{% extends "games/editor_base.html" %}
{% block title %}Edit action | SmartScumm editor{% endblock %}
{% block content %}
<h1 class="h2">Edit action</h1>
<p><a href="{% url 'editor-actions' action.game_id %}">All actions</a></p>
<div class="card"><div class="card-body">
  <form method="post" class="editor-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save action</button>
  </form>
  <form method="post" action="{% url 'editor-action-delete' action.game_id action.pk %}" class="mt-3">
    {% csrf_token %}
    <button class="btn btn-outline-danger" type="submit">Delete action</button>
  </form>
</div></div>
{% endblock %}
